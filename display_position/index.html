<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Display & Positioning</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Display & Positioning</h1>

  <div class="block">Block Element</div>
  <span class="inline">Inline Element</span>
  <div class="inline-block">Inline-Block Element</div>

  <div class="invisible">You can’t see me (visibility: hidden)</div>

  <div class="pos-static">Static Position</div>
  <div class="pos-relative">Relative Position (shifted)</div>
  <div class="pos-absolute">Absolute Position</div>
  <div class="pos-fixed">Fixed to screen</div>
</body>
</html>
